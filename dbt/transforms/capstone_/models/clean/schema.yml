version: 2

models:
  - name: clean_dpwh_avg_iri
    description: "Cleaned DPWH Average IRI (International Roughness Index) data for trend and road quality analysis."
    tags: ["clean", "dpwh"]
    columns:
      - name: region
        description: "Region name, standardized to uppercase."
        tests:
          - not_null
          - unique
      - name: avg_iri
        description: "Average IRI value for the road segment."
        tests:
          - not_null

  - name: clean_dpwh_bridge_condition
