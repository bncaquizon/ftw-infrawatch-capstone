version: 2

models:
  # DPWH Average IRI
  - name: dq_dpwh_avg_iri_summary
    description: "Data quality summary for DPWH Average IRI table"
    columns:
      - name: row_count_raw
        description: "Total number of rows in the raw DPWH Average IRI table"
      - name: row_count_clean
        description: "Total number of rows in the clean DPWH Average IRI table"
      - name: dropped_rows
        description: "Number of rows dropped during cleaning (raw - clean)"
      - name: null_pct_region
        description: "Percentage of null values in the region column"
      - name: duplicate_regions
        description: "Count of duplicate region entries in the clean table"
      - name: negative_iri
        description: "Count of rows with negative Average IRI values"
      - name: outlier_jump
        description: "Count of rows with extreme year-to-year IRI jumps"

  - name: dq_dpwh_avg_iri_anomalies
    description: "Row-level data quality anomalies for DPWH Average IRI table"
    columns:
      - name: region
        description: "Region name in uppercase"
      - name: year_2012
        description: "Average IRI for year 2012"
      - name: year_2013
        description: "Average IRI for year 2013"
      - name: year_2014
        description: "Average IRI for year 2014"
      - name: year_2015
        description: "Average IRI for year 2015"
