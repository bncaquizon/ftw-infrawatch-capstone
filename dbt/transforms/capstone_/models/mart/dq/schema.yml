        description: "Average IRI for year 2019"
      - name: year_2020
        description: "Average IRI for year 2020"
      - name: year_2021
        description: "Average IRI for year 2021"
      - name: year_2022
        description: "Average IRI for year 2022"
      - name: year_2023
        description: "Average IRI for year 2023"
      - name: year_2024
        description: "Average IRI for year 2024"
      - name: dq_issue
        description: "Classification of the detected data quality issue for the row (null_region, negative_iri, outlier_jump)"

